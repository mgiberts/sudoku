name: Deploy Sudoku

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sudoku-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run format:check && bun run typecheck && bun run test

      - name: Build preview
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: bun run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore release metadata on retry
        id: metadata
        env:
          ARTIFACT_NAME: release-${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          artifact_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id")
          if [ -n "$artifact_id" ]; then
            gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/release"
            echo 'restored=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release version
        run: bun scripts/release-cli.ts resolve "$RUNNER_TEMP/release/release.json"

      - name: Persist release metadata before deployment
        if: steps.metadata.outputs.restored != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_id }}
          path: ${{ runner.temp }}/release/release.json
          if-no-files-found: error
          retention-days: 90

      - name: Build release
        run: bun run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUDOKU_HOSTNAME: ${{ secrets.SUDOKU_HOSTNAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const { CLOUDFLARE_ACCOUNT_ID, SUDOKU_HOSTNAME, CLOUDFLARE_API_TOKEN, RUNNER_TEMP, GITHUB_WORKSPACE } = process.env;
          if (!CLOUDFLARE_ACCOUNT_ID || !SUDOKU_HOSTNAME || !CLOUDFLARE_API_TOKEN) {
            throw new Error('Configure CLOUDFLARE_ACCOUNT_ID, SUDOKU_HOSTNAME, and CLOUDFLARE_API_TOKEN secrets.');
          }
          console.log(`::add-mask::${CLOUDFLARE_ACCOUNT_ID}`);
          console.log(`::add-mask::${SUDOKU_HOSTNAME}`);
          writeFileSync(join(RUNNER_TEMP, 'sudoku-wrangler.json'), JSON.stringify({
            name: 'sudoku',
            account_id: CLOUDFLARE_ACCOUNT_ID,
            compatibility_date: '2026-09-10',
            workers_dev: false,
            preview_urls: false,
            assets: { directory: join(GITHUB_WORKSPACE, 'dist') },
            routes: [{ pattern: SUDOKU_HOSTNAME, custom_domain: true }],
          }));
          JS
          bunx wrangler@4.131.0 deploy --config "$RUNNER_TEMP/sudoku-wrangler.json"

      - name: Publish GitHub tag and release
        run: bun scripts/release-cli.ts publish "$RUNNER_TEMP/release/release.json"

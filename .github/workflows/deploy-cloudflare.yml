name: Deploy Sudoku

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sudoku-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run format:check && bun run typecheck && bun run test

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUDOKU_HOSTNAME: ${{ secrets.SUDOKU_HOSTNAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const { CLOUDFLARE_ACCOUNT_ID, SUDOKU_HOSTNAME, CLOUDFLARE_API_TOKEN, RUNNER_TEMP, GITHUB_WORKSPACE } = process.env;
          if (!CLOUDFLARE_ACCOUNT_ID || !SUDOKU_HOSTNAME || !CLOUDFLARE_API_TOKEN) {
            throw new Error('Configure CLOUDFLARE_ACCOUNT_ID, SUDOKU_HOSTNAME, and CLOUDFLARE_API_TOKEN secrets.');
          }
          console.log(`::add-mask::${CLOUDFLARE_ACCOUNT_ID}`);
          console.log(`::add-mask::${SUDOKU_HOSTNAME}`);
          writeFileSync(join(RUNNER_TEMP, 'sudoku-wrangler.json'), JSON.stringify({
            name: 'sudoku',
            account_id: CLOUDFLARE_ACCOUNT_ID,
            compatibility_date: '2026-09-10',
            workers_dev: false,
            preview_urls: false,
            assets: { directory: join(GITHUB_WORKSPACE, 'dist') },
            routes: [{ pattern: SUDOKU_HOSTNAME, custom_domain: true }],
          }));
          JS
          bunx wrangler@4.131.0 deploy --config "$RUNNER_TEMP/sudoku-wrangler.json"
